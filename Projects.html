<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selected Work - Projects</title>
   
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. CORE STYLES & COLOR PALETTE (#fdf0d5 & #669bbc)
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdf0d5; /* Creamy background */
            color: #1a202c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Hide dynamic Navbar elements injected by navbar.js when popups/lightboxes are active */
        body.modal-open #navbar-container,
        body.modal-open .nav-container,
        body.modal-open .mobile-drawer-overlay,
        body.modal-open .mobile-drawer {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            display: none !important;
        }

        body.modal-open {
            overflow: hidden; /* Prevent background scrolling */
        }

        .main-wrapper {
            max-width: 1400px;
            margin: 100px auto 80px auto;
            padding: 0 20px;
            width: 100%;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 40px;
            color: #16232E;
            letter-spacing: -0.5px;
        }

        /* ==========================================================================
           2. PROJECTS GRID
           ========================================================================== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
            width: 100%;
        }

        .project-card {
            border: 2px solid #16232E;
            border-radius: 16px;
            padding: 20px;
            background: #ffffff; /* White background for normal cards */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 4px 4px 0px #16232E;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
            cursor: pointer;
        }

        /* Bluish hover style (#669bbc) */
        .project-card:hover {
            background-color: #669bbc;
            color: #ffffff;
            transform: translateY(-5px);
            box-shadow: 8px 8px 0px #16232E;
        }

        .card-top-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-image-wrapper {
            width: 100%;
            height: 220px;
            border: 1.5px solid #16232E;
            border-radius: 10px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-year {
            font-size: 0.85rem;
            font-weight: 700;
            color: inherit;
            margin-top: 4px;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: inherit;
            line-height: 1.3;
        }

        /* Tags Container */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }

        .tag-pill {
            border: 1px solid #16232E;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #16232E;
            background: #fdf0d5;
            white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .project-card:hover .tag-pill {
            background: #ffffff;
            color: #16232E;
        }

        .btn-view-project {
            width: 100%;
            padding: 12px 0;
            border: 1.5px solid #16232E;
            border-radius: 8px;
            background: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            color: #16232E;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            text-align: center;
            margin-top: 12px;
        }

        .project-card:hover .btn-view-project {
            background: #16232E;
            color: #ffffff;
        }

        /* ==========================================================================
           3. PROJECT DETAILS MODAL
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(22, 35, 46, 0.7);
            backdrop-filter: blur(6px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            background: #ffffff;
            border: 2px solid #16232E;
            border-radius: 16px;
            width: 100%;
            max-width: 950px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 10px 0px #16232E;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .modal-overlay.active .modal-window {
            transform: translateY(0);
        }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 2px solid #16232E;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fdf0d5;
        }

        .modal-back-btn {
            border: 1.5px solid #16232E;
            border-radius: 8px;
            padding: 6px 14px;
            background: #ffffff;
            font-size: 0.85rem;
            font-weight: 700;
            color: #16232E;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .modal-back-btn:hover {
            background: #669bbc;
            color: #ffffff;
        }

        .modal-header-title {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #16232E;
            margin: 0 12px;
            text-align: center;
        }

        .close-modal-btn {
            border: 1.5px solid #16232E;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            background: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .close-modal-btn:hover {
            background: #669bbc;
            color: #ffffff;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: #ffffff;
        }

        /* Uncropped, Fully Visible Media in Modal */
        .modal-media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .media-item {
            border: 1.5px solid #16232E;
            border-radius: 12px;
            overflow: hidden;
            background: #fdf0d5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Makes sure images are fully visible without cropping */
        .media-item img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            display: block;
            cursor: zoom-in;
            background: #ffffff;
            padding: 8px;
        }

        .media-item video {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            display: block;
            background: #000000;
        }

        .media-caption {
            font-size: 0.8rem;
            font-weight: 600;
            color: #16232E;
            padding: 10px 14px;
            text-align: center;
            border-top: 1.5px solid #16232E;
            background: #fdf0d5;
            width: 100%;
        }

        .modal-text-content {
            font-size: 1rem;
            line-height: 1.7;
            color: #2d3748;
            background: #fdf0d5;
            padding: 20px;
            border-radius: 12px;
            border: 1.5px solid #16232E;
        }

        .modal-text-content b {
            color: #16232E;
        }

        /* ==========================================================================
           4. FULLSCREEN IMAGE LIGHTBOX
           ========================================================================== */
        .fullscreen-lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 20000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .fullscreen-lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20001;
        }

        .lightbox-back-btn {
            border: 1.5px solid #ffffff;
            border-radius: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .lightbox-back-btn:hover {
            background: #669bbc;
            border-color: #669bbc;
        }

        .lightbox-image-container {
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-image-container img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .lightbox-caption {
            color: #ffffff;
            margin-top: 16px;
            font-size: 0.95rem;
            text-align: center;
            max-width: 800px;
        }

        /* Responsive Tweaks */
        @media (max-width: 600px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }

            .main-wrapper {
                margin-top: 80px;
                padding: 0 16px 40px 16px;
            }

            .modal-window {
                max-height: 95vh;
            }
           
            .modal-body {
                padding: 16px;
            }

            .modal-header {
                padding: 12px 16px;
            }

            .modal-header-title {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Container for dynamic Navigation Bar insertion -->
    <div id="navbar-container">
        <script src="navbar.js"></script>
    </div>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <h1 class="section-title">Selected Work</h1>

        <!-- Projects Grid Container -->
        <div class="projects-grid" id="projects-grid-container">
            <!-- Project Cards generated dynamically via JavaScript -->
        </div>
    </div>

    <!-- Project Details Modal Popup -->
    <div class="modal-overlay" id="project-modal" onclick="handleOverlayClick(event)">
        <div class="modal-window">
            <div class="modal-header">
                <button class="modal-back-btn" onclick="closeProjectModal()">&#8592; Back to Projects</button>
                <span class="modal-header-title" id="modal-header-title">PROJECT DETAILS</span>
                <button class="close-modal-btn" onclick="closeProjectModal()" aria-label="Close modal">&#10005;</button>
            </div>
            <div class="modal-body">
                <div class="modal-media-grid" id="modal-media-container"></div>
                <div class="modal-text-content" id="modal-text-container"></div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Image Lightbox -->
    <div class="fullscreen-lightbox" id="fullscreen-lightbox">
        <div class="lightbox-top-bar">
            <button class="lightbox-back-btn" onclick="closeFullscreenImage()">&#8592; Back </button>
        </div>
        <div class="lightbox-image-container">
            <img id="lightbox-img" src="" alt="Full size image">
        </div>
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script>
        /* ==========================================================================
           PROJECT DATASET (Extended to 8 Projects)
           ========================================================================== */
        const originalDataset = [
            {
                year: "2026",
                role: "Gait Patterns in PIKA Quadruped",
                image: "assets/pika.jpg",
                tags: ["Python", "Fusion 360", "Kinematics", "Embedded Systems", "3D Printing"],
                mediaAssets: [
                    { type: 'image', src: 'assets/pika.jpg', alt: 'Walk Gait Analysis', caption: 'Fig 1.1: Walk Cycle Trajectory Generation' },
                    { type: 'image', src: 'assets/pika_2.jpg', alt: 'Trot Gait Testing', caption: 'Fig 1.2: Trot Phase Real-World Hardware Verification' },
                    { type: 'video', src: 'assets/pika_0.mp4', caption: 'Video 1.3: Python Implementation of Gait Control' },
                    { type: 'video', src: 'assets/pika_demo.mp4', caption: 'Video 1.4: Locomotion Transition Demonstration' }
                ],
                textContent: `
                    <b>Skills and Softwares used: Python, Fusion 360, Forward and Inverse Kinematics (basics), Embedded Systems, 3D Printing</b><br><br>
                    Implemented and validated bio-inspired gait trajectories for the 12-DOF PIKA quadruped robot by reproducing the locomotion framework presented in the paper <i>"Bio-Inspired Trajectory Generation for Quadruped Robots"</i>. The published joint-angle trajectories were integrated into the robot to execute five distinct gait patterns—Walk, Trot, Canter, Transverse Gallop, and Rotary Gallop—for real-world hardware evaluation. While the original framework provided mathematical equations to generate gait cycles, this implementation focused on deploying and experimentally validating the individual gait cycles on the physical quadruped platform, demonstrating stable and repeatable locomotion across multiple gait modes.
                `
            },
            {
                year: "2025",
                role: "TSA-actuated Robotic Hand",
                image: "assets/tsaber_1.jpg",
                tags: ["Python", "ROS2", "VS Code", "Neural Networks", "Fusion 360"],
                mediaAssets: [
                    { type: 'image', src: 'assets/tsaber_1.jpg', alt: 'TSA Mechanism', caption: 'Fig 2.1: Robotic Arm Grasping Configurations' }
                ],
                textContent: `
                    <b>Skills and Softwares used: Python, ROS2, VS Code, Neural Networks, Fusion 360, 3D Printing</b><br><br>
                    Patent Pending with Application Number: 202611086086.
                `
            },
            {
                year: "2025",
                role: "Voice-controlled Prosthetic Arm",
                image: "assets/pros.png",
                tags: ["Arduino IDE", "Platform IO", "EMG Sensors", "Prosthetics"],
                mediaAssets: [
                    { type: 'image', src: 'assets/pros.png', alt: 'Prosthetic Arm Frame', caption: 'Fig 3.1: Testing with an Amputee Patient' }
                ],
                textContent: `
                    <b>Skills and Softwares used: Arduino IDE, Platform IO</b><br><br>
                    Developed an EMG- and voice-controlled prosthetic arm in collaboration with <b>Jaipur Foot</b>, the world's largest organization providing prosthetic limbs to people with disabilities. The system enables users to operate the prosthetic hand through either EMG muscle-signal threshold detection or voice commands, allowing intuitive opening and closing of the hand. By offering multiple control modalities, the design improves accessibility, ease of use, and everyday functionality for upper-limb amputees.
                `
            },
            {
                year: "2025",
                role: "Detachable PowerDrive System",
                image: "assets/chair.png",
                tags: ["Python", "ROS 2", "Gazebo", "Linux", "Robotics"],
                mediaAssets: [
                    { type: 'image', src: 'assets/chair.png', alt: 'PowerDrive Structural Base', caption: 'Fig 4.1: Attached Configuration' },
                    { type: 'image', src: 'assets/wheel_ros.png', alt: 'ROS 2 Integration', caption: 'Fig 4.2: Integration with ROS 2' },
                    { type: 'video', src: 'assets/wheelchair.mp4', caption: 'Video 4.3: Locomotion Demonstration' },
                    { type: 'video', src: 'assets/pwd.mp4', caption: 'Video 4.4: App based Control Testing with ROS 2' }
                ],
                textContent: `
                    <b>Skills and Softwares used: Python, ROS 2, Gazebo, Linux</b><br><br>
                    Designed and developed a detachable PowerDrive system that can be retrofitted onto conventional manual wheelchairs, transforming them into powered mobility devices for elderly users, patients, and people with disabilities. The modular attachment can be quickly installed or removed, reducing the overall weight compared to conventional electric wheelchairs while improving portability and ease of transport. The system supports multiple control modes, including joystick-based and mobile app-based operation, providing flexible user interaction. To validate the design before hardware deployment, the complete wheelchair model was integrated with ROS 2 and Gazebo, enabling simulation, kinematic testing, and autonomous navigation experiments in a virtual environment prior to real-world implementation.
                `
            },
            {
                year: "2024",
                role: "Robo-View: Kinematics Visualizer",
                image: "assets/roboview.png",
                tags: ["HTML/CSS/JS", "Three.js", "Node.js", "URDF"],
                mediaAssets: [
                    { type: 'image', src: 'assets/roboview.png', alt: 'Visualizer Interface', caption: 'Fig 5.1: Real-time Coordinate Transform Engine' },
                    { type: 'video', src: 'assets/roro.mp4', caption: 'Video 5.2: Initial Web-site Testing' }
                ],
                textContent: `
                    <b>Skills and Softwares used: HTML, CSS, JavaScript, Three.js, Node.js</b><br><br>
                    Developed <b>Robo-View</b>, an open-source web-based URDF visualizer that enables users to import robotic models in URDF format and interactively explore their kinematic behavior. The platform provides manual joint controllers for manipulating individual joints in real time, allowing users to visualize robot motion, inspect link transformations, and understand the robot's reachable configurations and configuration space. By bringing URDF visualization to the browser, Robo-View offers a lightweight alternative for quickly analyzing robotic kinematics without requiring expertise in desktop simulation tools such as ROS 2 and Rviz.
                `
            },
            {
                year: "2024",
                role: "Object Detection & Tracking System",
                image: "assets/foot.jpg",
                tags: ["Python", "YOLOv11", "OpenCV", "Computer Vision"],
                mediaAssets: [
                    { type: 'image', src: 'assets/foot.jpg', alt: 'Convolutional Identification Output', caption: 'Fig 6.1: A frame from the Output feed' }
                ],
                textContent: `
                    <b>Skills and Softwares used: Python, YOLOv11, OpenCV</b><br><br>
                    This project focuses on identifying and tracking players in a football match using a combination of deep learning-based object detection and player re-identification techniques. Leveraging YOLOv11 for real-time object detection, the system accurately identifies players in each frame of a match video, while a custom team-color classifier helps associate each player with their team (red, white, or yellow jerseys). This allows the system to display individual IDs, team affiliations, and track player movements consistently across frames.<br><br>
                    To maintain robust tracking, the project integrates the BoT-SORT (Better Object Tracking with Strong ReID) framework, enabling smooth re-identification even in the presence of occlusions or fast movements. Additionally, the project includes a real-time tactical map that visualizes player positions on the field using live positional data. The system outputs an annotated video along with this tactical view, making it a powerful tool for sports analytics and visual review.
                `
            }
           
        ];

        /* ==========================================================================
           RENDER CARDS
           ========================================================================== */
        function renderProjectCards() {
            const container = document.getElementById('projects-grid-container');
            container.innerHTML = '';

            originalDataset.forEach((project, index) => {
                const tagPills = project.tags.map(tag => `<span class="tag-pill">${tag}</span>`).join('');
               
                const cardHTML = `
                    <div class="project-card" onclick="openProjectModal(${index})">
                        <div class="card-top-content">
                            <div class="card-image-wrapper">
                                <img src="${project.image}" alt="${project.role}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80'">
                            </div>
                            <div class="card-year">${project.year}</div>
                            <h2 class="card-title">${project.role}</h2>
                            <div class="tags-container">
                                ${tagPills}
                            </div>
                        </div>
                        <button class="btn-view-project" onclick="event.stopPropagation(); openProjectModal(${index})">View Project</button>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        /* ==========================================================================
           MODAL LOGIC
           ========================================================================== */
        function openProjectModal(index) {
            const project = originalDataset[index];
           
            // Set header title
            document.getElementById('modal-header-title').textContent = project.role;

            // Render Media
            const mediaContainer = document.getElementById('modal-media-container');
            mediaContainer.innerHTML = '';
           
            if (project.mediaAssets && project.mediaAssets.length > 0) {
                project.mediaAssets.forEach(asset => {
                    const mediaWrapper = document.createElement('div');
                    mediaWrapper.className = 'media-item';

                    if (asset.type === 'image') {
                        mediaWrapper.innerHTML = `
                            <img src="${asset.src}" alt="${asset.alt || 'Project media'}" onclick="openFullscreenImage('${asset.src}', '${asset.caption || ''}')" onerror="this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80'">
                            <div class="media-caption">${asset.caption || ''}</div>
                        `;
                    } else if (asset.type === 'video') {
                        mediaWrapper.innerHTML = `
                            <video controls muted playsinline>
                                <source src="${asset.src}" type="video/mp4">
                                Your browser does not support video playback.
                            </video>
                            <div class="media-caption">${asset.caption || ''}</div>
                        `;
                    }
                    mediaContainer.appendChild(mediaWrapper);
                });
            }

            // Render Text Content
            document.getElementById('modal-text-container').innerHTML = project.textContent;

            // Activate Modal and Hide Navbar
            document.body.classList.add('modal-open');
            document.getElementById('project-modal').classList.add('active');
        }

        function closeProjectModal() {
            // Deactivate Modal and Restore Navbar
            document.body.classList.remove('modal-open');
            document.getElementById('project-modal').classList.remove('active');
           
            // Pause any running modal videos
            const videos = document.querySelectorAll('#modal-media-container video');
            videos.forEach(video => video.pause());
        }

        function handleOverlayClick(event) {
            if (event.target.classList.contains('modal-overlay')) {
                closeProjectModal();
            }
        }

        /* ==========================================================================
           FULLSCREEN LIGHTBOX LOGIC
           ========================================================================== */
        function openFullscreenImage(src, caption) {
            const lightbox = document.getElementById('fullscreen-lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCaption = document.getElementById('lightbox-caption');

            lightboxImg.src = src;
            lightboxCaption.textContent = caption;
            lightbox.classList.add('active');
        }

        function closeFullscreenImage() {
            const lightbox = document.getElementById('fullscreen-lightbox');
            lightbox.classList.remove('active');
        }

        // Global key handler
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const lightbox = document.getElementById('fullscreen-lightbox');
                if (lightbox.classList.contains('active')) {
                    closeFullscreenImage();
                } else {
                    closeProjectModal();
                }
            }
        });

        // Initialize grid on load
        window.addEventListener('DOMContentLoaded', renderProjectCards);
    </script>
</body>
</html>
